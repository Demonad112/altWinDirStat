name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    env:
      PROJECT: WinDirStat\windirstat\windirstat.vcxproj
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - name: Restore WTL package
        shell: pwsh
        run: nuget restore WinDirStat\windirstat\packages.config -PackagesDirectory WinDirStat\packages -NonInteractive

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = "0.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build (Release|${{ matrix.platform }})
        shell: pwsh
        run: >
          msbuild $env:PROJECT /m /nologo /v:minimal
          /p:Configuration=Release /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=v143 /p:RunCodeAnalysis=false /p:EnablePREfast=false
          /p:SolutionDir=$pwd\WinDirStat\

      - name: Collect binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path WinDirStat -Recurse -Filter windirstat.exe |
                 Where-Object { $_.FullName -notmatch '\\packages\\' } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "windirstat.exe not found after build" }
          Write-Host "Built: $($exe.FullName) ($([math]::Round($exe.Length/1MB,2)) MB)"
          $out = "dist\altWinDirStat-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item $exe.FullName "$out\altWinDirStat.exe"
          Copy-Item WinDirStat\windirstat\res\license.txt "$out\LICENSE.txt"
          Copy-Item WinDirStat\windirstat\gpl-2.0.txt "$out\gpl-2.0.txt"
          Copy-Item README.md "$out\README.md"
          Compress-Archive -Path "$out\*" -DestinationPath "dist\altWinDirStat-${{ steps.ver.outputs.version }}-${{ matrix.platform }}-portable.zip"

      - name: Smoke test (launches, shows the drive start screen)
        shell: pwsh
        run: |
          Add-Type -Namespace W -Name S -MemberDefinition '[DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern System.IntPtr FindWindowW(string c, string t);'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process -FilePath "dist\altWinDirStat-${{ matrix.platform }}\altWinDirStat.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "altWinDirStat exited early with code $($p.ExitCode)" }
          # With no path argument the app opens the "What do you want to scan?" start screen.
          $dlg = [W.S]::FindWindowW($null, 'altWinDirStat - What do you want to scan?')
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshots\altWinDirStat-${{ matrix.platform }}-start-screen.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force
          if ($dlg -eq [IntPtr]::Zero) { throw "Drive start screen did not appear" }
          Write-Host "Process $($p.Id) alive after 8s, start screen shown - OK"

      - name: GUI scan test + screenshot (proves it runs as a windowed viewer on Windows Server)
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) build $($os.BuildNumber)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force screenshots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("screenshots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          # The scan runs on worker threads but the UI thread waits for it, so the window stops
          # responding while scanning and responds again once results are shown.
          function ScanAndWait($target, $label, $timeoutSec, [bool]$required) {
            $p = Start-Process -FilePath "dist\altWinDirStat-${{ matrix.platform }}\altWinDirStat.exe" -ArgumentList "`"$target`"" -PassThru
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Start-Sleep -Seconds 3
            while ($sw.Elapsed.TotalSeconds -lt $timeoutSec) {
              if ($p.HasExited) { throw "altWinDirStat exited while scanning $target (code 0x$('{0:X8}' -f $p.ExitCode))" }
              $p.Refresh()
              if ($p.Responding -and $p.MainWindowHandle -ne 0) { break }
              Start-Sleep -Seconds 1
            }
            $p.Refresh()
            $done = $p.Responding -and ($p.MainWindowHandle -ne 0)
            Write-Host ("[{0}] target='{1}' done={2} elapsed={3:N1}s window='{4}'" -f $label, $target, $done, $sw.Elapsed.TotalSeconds, $p.MainWindowTitle)
            Start-Sleep -Seconds 2
            Shot "altWinDirStat-${{ matrix.platform }}-$($os.BuildNumber)-$label"
            Stop-Process -Id $p.Id -Force
            if ($required -and -not $done) { throw "Scan of $target did not finish within $timeoutSec s" }
          }
          # Required: a known, moderately sized tree (this repo + build output).
          ScanAndWait "$env:GITHUB_WORKSPACE" "repo" 180 $true
          # Informational: a large real-world folder (full Visual Studio install lives here).
          ScanAndWait "C:\Program Files" "program-files" 420 $false

      - name: Rescan (Refresh) + settings migration test
        shell: pwsh
        run: |
          # Regression test for the post-Delete rescan crash (use-after-free of the old tree while the views
          # repainted), and for the one-time HKCU\Software\Seifert -> HKCU\Software\altWinDirStat migration.
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool PostMessageW(System.IntPtr h, uint m, System.IntPtr w, System.IntPtr l);'
          $ID_CLEANUP_REFRESH = 33030  # resource.h
          $started = Get-Date

          # Seed a legacy settings key with a marker value; the new key must not exist yet.
          $old = 'HKCU:\Software\Seifert\altWinDirStat\options'
          $new = 'HKCU:\Software\altWinDirStat\altWinDirStat'
          Remove-Item 'HKCU:\Software\altWinDirStat' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $old -Force | Out-Null
          Set-ItemProperty $old treemapHighlightColor 0x00ABCDEF -Type DWord

          $dir = "$env:RUNNER_TEMP\rescan-test"
          New-Item -ItemType Directory -Force "$dir\sub" | Out-Null
          1..20 | ForEach-Object { Set-Content "$dir\f$_.txt" ("x" * (100 * $_)) }
          Set-Content "$dir\sub\inner.dat" ("y" * 5000)

          function WaitIdle($p, $what) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            do {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { throw "altWinDirStat exited during $what (code 0x$('{0:X8}' -f $p.ExitCode))" }
              $p.Refresh()
            } until (($p.Responding -and $p.MainWindowHandle -ne 0) -or $sw.Elapsed.TotalSeconds -gt 60)
            if (-not $p.Responding) { throw "altWinDirStat hung during $what" }
          }

          $p = Start-Process -FilePath "dist\altWinDirStat-${{ matrix.platform }}\altWinDirStat.exe" -ArgumentList "`"$dir`"" -PassThru
          Start-Sleep -Seconds 3
          WaitIdle $p "initial scan"
          foreach ($i in 1..5) {
            if ($i -eq 3) { Remove-Item "$dir\f20.txt" }   # tree shrinks between rescans, like after a Delete
            [void][W.U]::PostMessageW($p.MainWindowHandle, 0x0111, [IntPtr]$ID_CLEANUP_REFRESH, [IntPtr]::Zero)
            Start-Sleep -Seconds 1
            WaitIdle $p "refresh #$i"
            Write-Host "refresh #$i OK"
          }
          [void]$p.CloseMainWindow()
          if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force; throw "altWinDirStat did not exit after WM_CLOSE" }

          $crashes = @(Get-WinEvent -FilterHashtable @{ LogName='Application'; ProviderName='Application Error'; StartTime=$started } -ErrorAction SilentlyContinue |
                       Where-Object { $_.Message -match 'altWinDirStat' })
          if ($crashes.Count -gt 0) { $crashes | Format-List TimeCreated, Message; throw "Application Error logged for altWinDirStat" }

          if (-not (Test-Path "$new\options")) { throw "Settings were not migrated/saved to $new" }
          $v = (Get-ItemProperty "$new\options").treemapHighlightColor
          if ($v -ne 0x00ABCDEF) { throw ("Migrated treemapHighlightColor = 0x{0:X8}, expected 0x00ABCDEF" -f $v) }
          if (-not (Test-Path $old)) { throw "Legacy key was removed; migration must leave it in place" }
          Write-Host "Rescans survived; settings migrated to $new (marker 0x00ABCDEF preserved); legacy key left in place."

          # Options > Reset All Settings: confirm the prompt, then the app must wipe its settings and relaunch on the same folder,
          # without re-importing the legacy key.
          Add-Type -Namespace W -Name R -MemberDefinition @'
          [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern System.IntPtr FindWindowW(string c, string t);
          [DllImport("user32.dll")] public static extern System.IntPtr GetDlgItem(System.IntPtr h, int id);
          [DllImport("user32.dll")] public static extern System.IntPtr SendMessageW(System.IntPtr h, uint m, System.IntPtr w, System.IntPtr l);
          '@
          $ID_OPTIONS_RESET_SETTINGS = 33032  # resource.h
          $p = Start-Process -FilePath "dist\altWinDirStat-${{ matrix.platform }}\altWinDirStat.exe" -ArgumentList "`"$dir`"" -PassThru
          Start-Sleep -Seconds 3
          WaitIdle $p "scan before reset"
          [void][W.U]::PostMessageW($p.MainWindowHandle, 0x0111, [IntPtr]$ID_OPTIONS_RESET_SETTINGS, [IntPtr]::Zero)
          $box = [IntPtr]::Zero
          foreach ($i in 1..20) { Start-Sleep -Milliseconds 500; $box = [W.R]::FindWindowW('#32770', 'altWinDirStat - Reset All Settings'); if ($box -ne [IntPtr]::Zero) { break } }
          if ($box -eq [IntPtr]::Zero) { Stop-Process -Id $p.Id -Force; throw "Reset confirmation did not appear" }
          [void][W.R]::SendMessageW([W.R]::GetDlgItem($box, 6), 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)  # BM_CLICK on IDYES
          if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force; throw "App did not close after confirming reset" }
          Start-Sleep -Seconds 4
          $relaunched = Get-Process altWinDirStat -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $p.Id } | Select-Object -First 1
          if (-not $relaunched) { throw "App did not relaunch after reset" }
          $relaunched.Refresh()
          Write-Host "Relaunched as PID $($relaunched.Id), window '$($relaunched.MainWindowTitle)'"
          if ($relaunched.MainWindowTitle -notlike 'rescan-test*') { Stop-Process -Id $relaunched.Id -Force; throw "Relaunch did not reopen the same folder" }
          $after = (Get-ItemProperty "$new\options" -ErrorAction SilentlyContinue).treemapHighlightColor
          Stop-Process -Id $relaunched.Id -Force
          if ($after -eq 0x00ABCDEF) { throw "Settings were not reset (marker still present, or re-migrated from the legacy key)" }
          Write-Host "Reset All Settings wiped the settings and relaunched on the same folder."
          Remove-Item 'HKCU:\Software\Seifert\altWinDirStat' -Recurse -Force
          Remove-Item 'HKCU:\Software\altWinDirStat' -Recurse -Force

      - name: Crash diagnostics (WER full dump + cdb analysis)
        if: failure()
        shell: pwsh
        run: |
          $dumpDir = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force $dumpDir | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\altWinDirStat.exe"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty $key DumpFolder $dumpDir -Type ExpandString
          Set-ItemProperty $key DumpType 2 -Type DWord
          Set-ItemProperty $key DumpCount 3 -Type DWord
          $p = Start-Process "dist\altWinDirStat-${{ matrix.platform }}\altWinDirStat.exe" -ArgumentList '"C:\Program Files"' -PassThru
          if (-not $p.WaitForExit(120000)) { Write-Host "Did not crash within 120s"; Stop-Process -Id $p.Id -Force }
          else { Write-Host ("Exit code: 0x{0:X8}" -f $p.ExitCode) }
          Start-Sleep -Seconds 10
          $dump = Get-ChildItem $dumpDir -Filter *.dmp | Select-Object -First 1
          if (-not $dump) { Write-Host "No dump written"; exit 0 }
          $dbgArch = if ("${{ matrix.platform }}" -eq "x64") { "x64" } else { "x86" }
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\$dbgArch\cdb.exe"
          $pdb = Get-ChildItem -Path WinDirStat -Recurse -Filter windirstat.pdb | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $sym = "$($pdb.DirectoryName);srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          & $cdb -z $dump.FullName -y $sym -lines -c ".ecxr; kP 60; .echo ======; !analyze -v; q" 2>&1 | Select-Object -Last 300
          New-Item -ItemType Directory -Force crash | Out-Null
          Copy-Item $dump.FullName crash\
          Copy-Item $pdb.FullName crash\

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-${{ matrix.platform }}
          path: crash/*

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.platform }}
          path: screenshots/*.png

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" "/DArch=${{ matrix.platform }}" "/DSourceDir=$pwd\dist\altWinDirStat-${{ matrix.platform }}" "/O$pwd\dist" installer\altWinDirStat.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Installer test (silent install + uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "*Setup.exe" | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\awds-install"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"","/TASKS=contextmenu" -Wait
          if (-not (Test-Path "$dir\altWinDirStat.exe")) { throw "Installer did not place altWinDirStat.exe" }
          if (-not (Test-Path "HKCU:\Software\Classes\Directory\shell\altWinDirStat\command")) { throw "Context menu entry missing" }
          Write-Host "Installed OK to $dir (context menu registered)"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait

      - uses: actions/upload-artifact@v4
        with:
          name: altWinDirStat-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*Setup.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Only the installers and portable zips; CI screenshots are uploaded as artifacts, not release assets.
          files: |
            out/*.zip
            out/*Setup.exe
          generate_release_notes: true
